# Workflow
# Should have a name
name: Hello
# On tells when the workflow should run
on:
  workflow_dispatch: 

# Jobs
# Should be inside the Workflow
# Jobs tells what the workflow should do
jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello to everyone
        run: echo "Hello Everyone"

# Steps
# Should be inside the Jobs

# Actions
# Should be inside Steps
